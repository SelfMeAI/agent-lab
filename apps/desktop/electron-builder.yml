appId: ai.agent-lab.desktop
productName: Agent Lab
artifactName: Agent-Lab-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**/*"
extraResources:
  - from: ../../assets/brand/agent-lab-app-icon.png
    to: brand/agent-lab-app-icon.png
  - from: ../../LICENSE
    to: licenses/Agent-Lab-LICENSE
  - from: ../../NOTICE
    to: licenses/Agent-Lab-NOTICE
  - from: ../../THIRD_PARTY_NOTICES.txt
    to: licenses/THIRD_PARTY_NOTICES.txt
  - from: ../../runtimes/ollama
    to: ollama
    filter:
      - "**/*"
  - from: ../../runtimes/claude
    to: claude
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: ../../runtimes/steering-bridge.mjs
    to: steering-bridge.mjs
  - from: ../../runtimes/dsh/steering-loader.mjs
    to: dsh/steering-loader.mjs
  - from: ../../runtimes/dsh/node_modules
    to: dsh/node_modules
    filter:
      - "**/*"
  - from: ../../runtimes/codex
    to: codex
    filter:
      - "**/*"
  - from: ../../runtimes/kimi-code
    to: kimi-code
    filter:
      - "**/*"
      - "!bin/**/*"
      - "!node_modules/**/*"
  - from: ../../runtimes/kimi-code/node_modules
    to: kimi-code/node_modules
    filter:
      - "**/*"
  - from: ../../runtimes/qwen-code
    to: qwen-code
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: ../../runtimes/qwen-code/node_modules
    to: qwen-code/node_modules
    filter:
      - "**/*"
asar: true
mac:
  category: public.app-category.developer-tools
  icon: ../../assets/brand/agent-lab-app-icon.png
  identity: null
  target:
    - dmg
    - zip
dmg:
  writeUpdateInfo: false
win:
  icon: ../../assets/brand/agent-lab-app-icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: ../../assets/brand/agent-lab-app-icon.png
  category: Development
  executableName: agent-lab
  target:
    - AppImage
