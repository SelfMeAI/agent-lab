appId: ai.selfme.lab
productName: SelfMe Lab
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../runtimes/dsh/node_modules
    to: dsh/node_modules
    filter:
      - "**/*"
  - from: ../../runtimes/codex
    to: codex
    filter:
      - "**/*"
  - from: ../../runtimes/kimi-code
    to: kimi-code
    filter:
      - "**/*"
asar: true
mac:
  category: public.app-category.developer-tools
  icon: ../../assets/brand/selfme-lab-app-icon.png
  identity: null
  target:
    - dir
