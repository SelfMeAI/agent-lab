appId: ai.selfme.lab
productName: SelfMe Lab
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**/*"
extraResources:
  - from: ../../runtimes/claude
    to: claude
    filter:
      - "**/*"
  - from: ../../runtimes/steering-bridge.mjs
    to: steering-bridge.mjs
  - from: ../../runtimes/dsh/steering-loader.mjs
    to: dsh/steering-loader.mjs
  - from: ../../runtimes/dsh/node_modules
    to: dsh/node_modules
    filter:
      - "**/*"
  - from: ../../runtimes/codex
    to: codex
    filter:
      - "**/*"
  - from: ../../runtimes/kimi-code
    to: kimi-code
    filter:
      - "**/*"
      - "!bin/**/*"
      - "!node_modules/**/*"
  - from: ../../runtimes/kimi-code/node_modules
    to: kimi-code/node_modules
    filter:
      - "**/*"
  - from: ../../runtimes/qwen-code
    to: qwen-code
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: ../../runtimes/qwen-code/node_modules
    to: qwen-code/node_modules
    filter:
      - "**/*"
asar: true
mac:
  category: public.app-category.developer-tools
  icon: ../../assets/brand/selfme-lab-app-icon.png
  identity: null
  target:
    - dir
