name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Prepare Kimi Code test runtime
        run: npm run ensure:kimi
      - name: Prepare Qwen Code test runtime
        run: npm run ensure:qwen
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run test:remote
      - name: Windows native DSH ACP tool and steering round trips
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_LAB_STEERING_INTEGRATION: '1'
        run: |
          $env:AGENT_LAB_STEERING_NODE_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path -LiteralPath $env:AGENT_LAB_STEERING_NODE_EXECUTABLE)) { throw 'The bundled Electron Node executable was not restored' }
          npm run test --workspace '@agent-lab/desktop' -- packages/runtime/src/steering.integration.test.ts packages/runtime/src/user-questions.integration.test.ts -t dsh
      - run: npm run build
      - run: npm run check:source

