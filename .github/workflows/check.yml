name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Prepare Kimi Code test runtime
        run: npm run ensure:kimi
      - name: Prepare Qwen Code test runtime
        run: npm run ensure:qwen
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run test:remote
      - run: npm run build
      - run: npm run check:source

