name: Image maintenance

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release to add readable architecture tags to (without v)'
        required: true
        default: '0.1.0'
        type: string
      cleanup:
        description: 'Delete unreferenced verification images; preserve every release and its children'
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
concurrency:
  group: agent-lab-release
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node --test scripts/image-registry.test.mjs
      - name: Add aliases without rebuilding or changing release digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/registry.mjs --retag --version "v$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Clean only unused verification images
        if: inputs.cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/registry.mjs --cleanup --apply --repository "$GITHUB_REPOSITORY"
