name: Native desktop packages

# Native builds are opt-in. This reusable workflow never publishes releases.
# Signing is not configured; the release workflow separately handles uploads.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      matrix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix || '{"include":[{"id":"mac-arm64","os":"macos-15","platform":"mac","arch":"arm64"},{"id":"mac-x64","os":"macos-15-intel","platform":"mac","arch":"x64"},{"id":"win-x64","os":"windows-2022","platform":"win","arch":"x64"},{"id":"linux-x64","os":"ubuntu-24.04","platform":"linux","arch":"x64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev zstd xvfb dbus-x11 libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ Build Tools not found' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Cache source-built Codex and V8 dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: codex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtimes/codex/source.json', 'scripts/lib/codex-lock.mjs') }}-nodebug-v1
          path: |
            .cache/codex-build
            .cache/codex-v8
            ~/.cargo/registry
            ~/.cargo/git
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:runtimes
      - run: npm run doctor -- --scope codex
      - run: npm run build:codex -- --jobs 2
      - run: npm run verify:codex
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run test:remote
      - run: npm run check:source
      - run: npm run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Run the packaged application and bundled harnesses
        if: runner.os != 'Linux'
        run: node scripts/release/smoke-desktop.mjs
      - name: Run the packaged application and bundled harnesses (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/release/smoke-desktop.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Desktop-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/desktop-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain isolated package screenshots for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Package-QA-${{ matrix.id }}
          path: output/playwright/release/
          if-no-files-found: ignore
          retention-days: 14
